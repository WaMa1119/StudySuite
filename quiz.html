<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/img/SmallLogo.svg" type="image/x-icon">
    <title>StudySuite</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container quiz-card" id="quiz-screen">
        <div class="top-nav">
            <div class="progress-box">
                <span id="q-counter">Pregunta 1/15</span>
                <div class="bar-bg"><div id="bar-fill" class="bar-fill"></div></div>
            </div>
            <div class="score-badge">⭐ <span id="score-val">0</span> pts</div>
        </div>

        <div id="materia-tag" class="materia-tag">Materia</div>

        <div class="question-area">
            <h2 id="q-text">Cargando...</h2>
            
            <div id="media-box" class="media-box hidden">
                <img id="q-img" src="" class="hidden">
                <canvas id="q-canvas" width="300" height="200" class="hidden"></canvas>
            </div>

            <div class="options-list" id="options-list"></div>
        </div>

        <div class="interaction-buttons">
            <button id="btn-next" class="btn-next hidden" onclick="nextQuestion()">Siguiente pregunta ➔</button>
            <div class="sub-buttons">
                <button id="btn-hint" class="btn-info" onclick="toggleInfo('hint')">💡 Pista</button>
                <button id="btn-explain" class="btn-info hidden" onclick="toggleInfo('explain')">📖 Explicación</button>
            </div>
        </div>

        <div id="hint-text" class="info-bubble hint hidden"></div>
        <div id="explain-text" class="info-bubble explain hidden"></div>

        <div class="bottom-stats">
            <div class="stat green">🔥 Racha: <span id="streak">0</span></div>
            <div class="stat purple">10/10 🏆</div>
            <div class="stat orange">🎯 <span id="topic-tag">Tema</span></div>
        </div>

        <div class="love-note">¡Confío en vos! Vas a sacar 100</div>
        
        <button class="btn-exit" onclick="window.location.href='index.html'">Salir</button>
    </div>

    <div class="container result-card hidden" id="result-screen">
        <h1 id="res-title">¡Terminado!</h1>
        <div class="final-circle"><span id="res-percent">0%</span></div>
        <p id="res-msg"></p>
        <div class="res-details">
            <p>Correctas: <span id="res-ok">0</span></p>
            <p>Errores: <span id="res-bad">0</span></p>
        </div>
        <button class="btn-next" onclick="window.location.href='index.html'">Volver al inicio</button>
    </div>
 
    <script src="js/app.js"></script>
</body>
</html>
